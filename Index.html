<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WeatherPro - Designed by Ubaid Awan</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #0284c7, #0369a1);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 16px;
            transition: background 1s ease;
        }

        /* Live Rain Animation Layer */
        .rain-layer {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
            display: none;
        }
        .raindrop {
            position: absolute;
            background: rgba(255, 255, 255, 0.75);
            width: 2px; height: 18px;
            animation: fall 0.4s linear infinite;
        }
        @keyframes fall {
            to { transform: translateY(100vh); }
        }

        .wrapper {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 420px;
        }

        /* Top Branding */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
            padding: 0 4px;
        }
        .app-logo {
            font-size: 16px;
            font-weight: 700;
            color: #f8fafc;
        }
        .designer-tag {
            font-size: 11px;
            font-weight: 600;
            color: #38bdf8;
            background: rgba(56, 189, 248, 0.12);
            padding: 4px 10px;
            border-radius: 20px;
            border: 1px solid rgba(56, 189, 248, 0.3);
        }

        /* Search Bar */
        .search-box {
            display: flex;
            gap: 8px;
            margin-bottom: 14px;
        }
        .search-box input {
            flex: 1;
            padding: 12px 18px;
            border-radius: 25px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.15);
            color: white;
            font-size: 15px;
            outline: none;
        }
        .search-box input::placeholder {
            color: rgba(255, 255, 255, 0.65);
        }
        .search-box button {
            padding: 0 20px;
            border-radius: 25px;
            border: none;
            background: #38bdf8;
            color: #0f172a;
            font-weight: bold;
            cursor: pointer;
        }

        /* Quick Select Cities */
        .quick-cities {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding-bottom: 10px;
            scrollbar-width: none;
            margin-bottom: 10px;
        }
        .quick-cities::-webkit-scrollbar { display: none; }
        .q-btn {
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            cursor: pointer;
            white-space: nowrap;
        }
        .q-btn:active { background: #38bdf8; color: #0f172a; }

        /* Main Glass Card */
        .main-card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 28px;
            padding: 22px;
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.45);
        }

        .current-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.12);
        }
        .city-info h2 { font-size: 22px; font-weight: 700; }
        .city-info p { font-size: 13px; color: #cbd5e1; margin-top: 3px; }
        .temp-display { display: flex; align-items: center; gap: 10px; }
        .temp-val { font-size: 52px; font-weight: 800; line-height: 1; }
        .weather-emoji { font-size: 46px; }

        .stats-bar {
            display: flex;
            justify-content: space-between;
            background: rgba(0, 0, 0, 0.22);
            padding: 10px 14px;
            border-radius: 14px;
            margin-top: 14px;
            font-size: 12px;
            color: #cbd5e1;
        }
        .stats-bar b { color: #38bdf8; font-size: 13px; }

        .section-label {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: rgba(255, 255, 255, 0.65);
            margin: 18px 0 10px;
        }

        /* Hourly Horizontal Scroll */
        .hourly-scroll {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 6px;
            scrollbar-width: none;
        }
        .hourly-scroll::-webkit-scrollbar { display: none; }
        .hour-box {
            flex: 0 0 auto;
            min-width: 64px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 10px 8px;
            text-align: center;
        }
        .h-time { font-size: 11px; color: #cbd5e1; }
        .h-icon { font-size: 22px; margin: 6px 0; }
        .h-temp { font-size: 14px; font-weight: 700; }

        /* 7-Day Forecast */
        .daily-list { display: flex; flex-direction: column; gap: 8px; }
        .day-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.06);
            padding: 12px 14px;
            border-radius: 16px;
            cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: background 0.2s;
        }
        .day-row:active { background: rgba(255, 255, 255, 0.18); }
        .d-name { width: 35% !important; font-size: 14px; font-weight: 600; }
        .d-icon { width: 25% !important; text-align: center; font-size: 22px; }
        .d-temp { width: 40% !important; text-align: right; font-size: 14px; font-weight: 700; }

        /* Google Weather Style Popup Modal */
        .modal-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            z-index: 50;
            display: none;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .modal-box {
            background: #1e293b;
            border: 1px solid rgba(56, 189, 248, 0.4);
            width: 100%;
            max-width: 330px;
            border-radius: 26px;
            padding: 24px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.8);
            text-align: center;
        }
        .modal-big-icon { font-size: 55px; margin: 10px 0; }
        .modal-box h3 { font-size: 18px; color: #38bdf8; margin-bottom: 4px; }
        .modal-date { font-size: 12px; color: #94a3b8; margin-bottom: 16px; }
        .m-row { display: flex; justify-content: space-between; margin: 10px 0; font-size: 14px; border-bottom: 1px solid rgba(255,255,255,0.08); padding-bottom: 6px; }
        .m-close { width: 100%; margin-top: 18px; padding: 12px; border-radius: 16px; border: none; background: #38bdf8; color: #0f172a; font-weight: 700; font-size: 15px; cursor: pointer; }
    </style>
</head>

        let currentActiveData = null;

        function initRain() {
            const layer = document.getElementById('rainLayer');
            layer.innerHTML = '';
            for (let i = 0; i < 60; i++) {
                const drop = document.createElement('div');
                drop.className = 'raindrop';
                drop.style.left = Math.random() * 100 + 'vw';
                drop.style.animationDuration = (Math.random() * 0.3 + 0.3) + 's';
                drop.style.animationDelay = Math.random() * 2 + 's';
                layer.appendChild(drop);
            }
        }
        initRain();

                        {day: "Sunday", icon: "☀️", label: "Sunny", max: 29, min: 18, rain: 0, sunrise: "06:16 AM", sunset: "05:09 PM"},
                        {day: "Monday", icon: "🌧️", label: "Rain Showers", max: 21, min: 14, rain: 85, sunrise: "06:17 AM", sunset: "05:08 PM"},
                        {day: "Tuesday", icon: "⛅", label: "Cloudy", max: 23, min: 15, rain: 35, sunrise: "06:18 AM", sunset: "05:07 PM"},
                        {day: "Wednesday", icon: "☀️", label: "Sunny", max: 26, min: 16, rain: 0, sunrise: "06:19 AM", sunset: "05:07 PM"},
                        {day: "Thursday", icon: "☀️", label: "Clear Sky", max: 28, min: 17, rain: 0, sunrise: "06:20 AM", sunset: "05:06 PM"},
                        {day: "Friday", icon: "⛅", label: "Partly Cloudy", max: 25, min: 16, rain: 15, sunrise: "06:21 AM", sunset: "05:05 PM"}
                    ]
                };
                renderWeatherApp(currentActiveData);
            }
        }

        function triggerSearch() {
            const input = document.getElementById('cityInput');
            const val = input.value.trim();
            if (val !== "") {
                loadCityWeather(val);
                input.value = "";
            }
        }

        // Allow Enter key to search
        document.getElementById('cityInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                triggerSearch();
            }
        });

        function renderWeatherApp(data) {
            const card = document.getElementById('weatherCard');
            const rainLayer = document.getElementById('rainLayer');

            if (data.type === 'rain') {
                document.body.style.background = "linear-gradient(135deg, #0f172a, #064e3b)";
                rainLayer.style.display = 'block';
            } else if (data.type === 'night') {
                document.body.style.background = "linear-gradient(135deg, #090d16, #1e293b)";
                rainLayer.style.display = 'none';
            } else {
                document.body.style.background = "linear-gradient(135deg, #0284c7, #0369a1)";
                rainLayer.style.display = 'none';
            }

            let hourlyHTML = '';
            data.hourly.forEach(h => {
                hourlyHTML += `
                    <div class="hour-box">
                        <div class="h-time">${h.time}</div>
                        <div class="h-icon">${h.icon}</div>
                        <div class="h-temp">${h.temp}°</div>
                    </div>
                `;
            });

            let dailyHTML = '';
            data.daily.forEach((d, idx) => {
                dailyHTML += `
                    <div class="day-row" onclick="openDetailModal(${idx})">
                        <div class="d-name">${d.day}</div>
                        <div class="d-icon">${d.icon}</div>
                        <div class="d-temp">${d.max}° <span style="opacity:0.55; font-weight:400;">/ ${d.min}°</span></div>
                    </div>
                `;
            });

            card.innerHTML = `
                <div class="current-header">
                    <div class="city-info">
                        <h2>${data.name}, ${data.country}</h2>
                        <p>${data.condition} • Feels like ${data.feels}°</p>
                    </div>
                    <div class="temp-display">
                        <span class="weather-emoji">${data.icon}</span>
                        <span class="temp-val">${data.temp}°</span>
                    </div>
                </div>

                <div class="stats-bar">
                    <span>Humidity: <b>${data.humidity}%</b></span>
                    <span>Wind: <b>${data.wind} km/h</b></span>
                    <span>Rain: <b>${data.rain}%</b></span>
                </div>

                <div class="section-label">Hourly Forecast</div>
                <div class="hourly-scroll">${hourlyHTML}</div>

                <div class="section-label">7-Day Forecast (Tap any day)</div>
                <div class="daily-list">${dailyHTML}</div>
            `;
        }

        function openDetailModal(idx) {
            const d = currentActiveData.daily[idx];
            document.getElementById('modalContent').innerHTML = `
                <h3>${d.day}</h3>
                <div class="modal-date">Weather Details</div>
                <div class="modal-big-icon">${d.icon}</div>
                <div style="font-size: 16px; font-weight: bold; color: #f8fafc; margin-bottom: 14px;">${d.label}</div>
                
                <div class="m-row"><span>High Temperature:</span> <b>${d.max}°C</b></div>
                <div class="m-row"><span>Low Temperature:</span> <b>${d.min}°C</b></div>
                <div class="m-row"><span>Rain Probability:</span> <b>${d.rain}%</b></div>
                <div class="m-row"><span>Sunrise:</span> <b>${d.sunrise}</b></div>
                <div class="m-row"><span>Sunset:</span> <b>${d.sunset}</b></div>
                <button class="m-close" onclick="closeModal()">Close</button>
            `;
            document.getElementById('detailModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('detailModal').style.display = 'none';
        }

        window.onload = function() {
            loadCityWeather('Garhi Habibullah');
        };
    </script>
</body>
</html>
